<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15151e"><meta name="description" content="Un espacio tranquilo para concentrarte, organizarte y descansar.">
  <title>Ritual — tu espacio de enfoque</title><link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="scene" id="scene">
    <div class="backdrop" id="backdrop"></div><div class="shade"></div>
    <header class="topbar"><a class="wordmark" href="#" aria-label="Ritual, inicio">ritual<span>✳</span></a><div class="topbar-copy"><div class="motivation" id="motivation" aria-live="polite">“Un paso a la vez también te lleva lejos.”</div><span class="date" id="dateLabel"></span></div></header>
    <section class="focus" aria-label="Temporizador">
      <div class="greeting" id="greeting">Un momento para ti</div>
      <h1 id="focusPrompt">¿En qué quieres enfocarte?</h1>
      <div class="modes" role="tablist" aria-label="Modo de temporizador"><button class="mode active" data-mode="focus">Enfoque</button><button class="mode" data-mode="short">Pausa corta</button><button class="mode" data-mode="long">Pausa larga</button></div>
      <div class="session-dots" id="sessionDots" aria-label="Sesiones completadas"></div>
      <div class="timer" id="timer" aria-live="polite">25:00</div>
      <div class="timer-controls"><button class="control primary" id="startBtn"><span>▶</span><span class="button-label">Comenzar</span></button><button class="control glass" id="resetBtn" aria-label="Reiniciar" title="Reiniciar">↺</button></div>
    </section>
    <footer class="dock">
      <nav class="dock-group" aria-label="Herramientas"><button class="dock-button glass" data-panel="tasks" aria-label="Tareas"><span>☑️</span><small>Tareas</small></button><button class="dock-button glass" data-panel="music" aria-label="Música y sonidos"><span>🎵</span><small>Sonidos</small></button><button class="dock-button glass" data-panel="notes" aria-label="Notas"><span>📝</span><small>Notas</small></button><button class="dock-button glass" id="pipBtn" aria-label="Abrir ventana siempre visible" title="Ventana siempre visible"><span>◱</span><small>Flotante</small></button></nav>
      <div class="dock-right"><button class="dock-button glass" data-panel="stats" aria-label="Estadísticas"><span>📈</span><small>Progreso</small></button><button class="dock-button glass" id="ambientBtn" aria-label="Modo ambiente (ocultar todo)" title="Modo ambiente (ocultar todo)"><span>☁️</span><small>Ambiente</small></button><button class="dock-button glass" id="fullscreenBtn" aria-label="Pantalla completa" title="Pantalla completa"><span>⛶</span><small>Pantalla</small></button><button class="dock-button glass" id="settingsBtn" aria-label="Ajustes" title="Configuración"><span>⚙️</span><small>Ajustes</small></button></div>
    </footer>
  </main>
  <aside class="panel" id="panel" aria-hidden="true"><div class="panel-head"><div class="panel-title"><span class="panel-icon" id="panelIcon">☷</span><div><h2 id="panelTitle">Tareas</h2><p id="panelSubtitle"></p></div></div><button class="close-button" id="closePanel" aria-label="Cerrar">×</button></div><div class="panel-content" id="panelContent"></div></aside>
  <section class="float-widget" id="floatWidget" aria-label="Ventana flotante Ritual" hidden><header class="float-head" id="floatHead"><span class="float-brand">ritual ✳ <small>EN TU ESPACIO</small></span><div><button id="floatPopout" aria-label="Volver al panel de Ritual" title="Volver al panel de Ritual">↩</button><button id="floatMinimize" aria-label="Minimizar">−</button><button id="floatClose" aria-label="Cerrar ventana flotante">×</button></div></header><nav class="float-tabs" aria-label="Contenido flotante"><button data-float-view="focus" class="selected">Enfoque</button><button data-float-view="tasks">Tareas</button><button data-float-view="notes">Notas</button><button data-float-view="sounds">Sonidos</button></nav><div class="float-body" id="floatBody"></div></section>
  <aside class="media-float" id="mediaFloat" aria-label="Reproductor de música flotante" hidden><header class="media-float-head"><span class="media-record">♫</span><div class="media-track-meta"><small>REPRODUCIENDO</small><strong id="mediaTitle">Tu música</strong><span id="mediaProvider"></span></div><div class="media-float-actions"><button id="mediaMinimize" aria-label="Minimizar reproductor">−</button><button id="mediaClose" aria-label="Cerrar y detener música">×</button></div></header><div class="media-float-body" id="mediaFloatBody"></div></aside>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="settingsDialog"><form method="dialog" class="dialog-card settings-card"><header class="settings-head"><h2>⚙ Ajustes</h2><button class="close-button dialog-close" value="cancel" aria-label="Cerrar">×</button></header><div class="settings-block"><strong>Duración (minutos)</strong><div class="duration-fields"><label>Enfoque<input type="number" min="1" max="180" id="settingsFocus"></label><label>Pausa corta<input type="number" min="1" max="60" id="settingsShort"></label><label>Pausa larga<input type="number" min="1" max="90" id="settingsLong"></label></div></div><label class="setting-check">Cambiar a pausa automáticamente <input id="autoBreakSetting" type="checkbox"></label><label class="style-label">Estilo del reloj<select id="clockStyle"><optgroup label="Tipografía"><option value="bold">Default Bold</option><option value="light">Default Light</option><option value="soft">Soft</option><option value="bubble">Bubble</option><option value="minimal-light">Minimal Light</option><option value="minimal">Minimal</option><option value="serif">Serif</option><option value="serif-condensed">Serif Condensed</option><option value="sporty">Sporty</option><option value="heavy-wide">Heavy Wide</option><option value="digital">Digital</option><option value="handwritten">Handwritten</option></optgroup><optgroup label="Visualización"><option value="flip">Flip Clock</option><option value="progress">Progress Bar</option><option value="gauge">Gauge</option><option value="dot-matrix">Dot Matrix</option><option value="pie">Pie</option></optgroup></select></label><div class="color-fields"><label>Color del reloj<input type="color" id="timerColor"></label><label>Color del texto<input type="color" id="textColor"></label></div><label class="style-label">Icono de sesiones<select id="sessionIcon"><option value="heart">Corazones</option><option value="dots">Puntos</option><option value="stars">Estrellas</option><option value="tomatoes">Tomates</option><option value="bolts">Rayos</option><option value="graduation">Graduación</option><option value="snowflake">Copos de nieve</option><option value="snowman">Muñecos de nieve</option><option value="tree">Árboles de Navidad</option></select></label><label class="settings-volume">Volumen general <span><input type="range" min="0" max="1" step=".01" id="settingsVolume"><b id="settingsVolumeValue"></b></span></label><div class="settings-block"><strong>Fondo <span id="themeName">Atardecer</span></strong><div class="theme-grid" id="themeGrid"></div><label class="upload-label">▧ Usar mi imagen<input id="backgroundUpload" type="file" accept="image/*"></label></div><button class="save-button" id="saveSettings" value="default">Guardar ajustes</button></form></dialog>
  <script src="app.js"></script>
</body></html>
